<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Style: Split-screen code editor aesthetic with a magic wand transform -->
  <rect width="800" height="400" fill="#0d1117"/>
  <!-- Editor chrome (full width) -->
  <rect x="40" y="30" width="720" height="340" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <!-- Tab bar -->
  <rect x="40" y="30" width="720" height="32" rx="10" fill="#21262d"/>
  <rect x="40" y="50" width="720" height="12" fill="#21262d"/>
  <!-- Traffic lights -->
  <circle cx="62" cy="46" r="5.5" fill="#ff5f57"/>
  <circle cx="80" cy="46" r="5.5" fill="#febc2e"/>
  <circle cx="98" cy="46" r="5.5" fill="#28c840"/>
  <!-- Tab 1 (active) -->
  <rect x="140" y="35" width="110" height="24" rx="6" fill="#161b22"/>
  <text x="195" y="51" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">outline.mubu</text>
  <!-- Tab 2 -->
  <rect x="260" y="35" width="100" height="24" rx="6" fill="#0d1117"/>
  <text x="310" y="51" font-family="monospace" font-size="9" fill="#4ade80" text-anchor="middle">output.md</text>
  <!-- Divider line in middle -->
  <line x1="400" y1="62" x2="400" y2="370" stroke="#30363d" stroke-width="2"/>
  <!-- LEFT: Mubu outline format -->
  <g transform="translate(60, 75)">
    <text font-family="monospace" font-size="11">
      <tspan x="0" dy="18" fill="#c9d1d9">● </tspan><tspan fill="#d2a8ff" font-weight="600">产品设计原则</tspan>
      <tspan x="20" dy="20" fill="#8b949e">● </tspan><tspan fill="#c9d1d9">用户体验第一</tspan>
      <tspan x="20" dy="18" fill="#8b949e">● </tspan><tspan fill="#c9d1d9">简约不简单</tspan>
      <tspan x="40" dy="16" fill="#6e7681">● </tspan><tspan fill="#8b949e">减少认知负担</tspan>
      <tspan x="40" dy="16" fill="#6e7681">● </tspan><tspan fill="#8b949e">一致性原则</tspan>
      <tspan x="20" dy="18" fill="#8b949e">● </tspan><tspan fill="#c9d1d9">数据驱动决策</tspan>
      <tspan x="0" dy="24" fill="#c9d1d9">● </tspan><tspan fill="#d2a8ff" font-weight="600">技术架构</tspan>
      <tspan x="20" dy="20" fill="#8b949e">● </tspan><tspan fill="#c9d1d9">前端：React + TS</tspan>
      <tspan x="20" dy="18" fill="#8b949e">● </tspan><tspan fill="#c9d1d9">后端：Go 微服务</tspan>
      <tspan x="40" dy="16" fill="#6e7681">● </tspan><tspan fill="#8b949e">gRPC 通信</tspan>
      <tspan x="40" dy="16" fill="#6e7681">● </tspan><tspan fill="#8b949e">K8s 部署</tspan>
      <tspan x="20" dy="18" fill="#8b949e">● </tspan><tspan fill="#c9d1d9">数据库：PostgreSQL</tspan>
    </text>
  </g>
  <!-- CENTER: Magic transform indicator -->
  <g transform="translate(380, 175)">
    <circle cx="20" cy="20" r="18" fill="#7c3aed" opacity="0.2"/>
    <text x="20" y="26" font-family="system-ui" font-size="18" fill="#a78bfa" text-anchor="middle">⚡</text>
  </g>
  <!-- RIGHT: Markdown output -->
  <g transform="translate(420, 75)">
    <text font-family="monospace" font-size="11">
      <tspan x="0" dy="18" fill="#79c0ff"># </tspan><tspan fill="#c9d1d9" font-weight="600">产品设计原则</tspan>
      <tspan x="0" dy="22" fill="#79c0ff">## </tspan><tspan fill="#c9d1d9">用户体验第一</tspan>
      <tspan x="0" dy="20" fill="#79c0ff">## </tspan><tspan fill="#c9d1d9">简约不简单</tspan>
      <tspan x="0" dy="18" fill="#c9d1d9">- </tspan><tspan fill="#8b949e">减少认知负担</tspan>
      <tspan x="0" dy="16" fill="#c9d1d9">- </tspan><tspan fill="#8b949e">一致性原则</tspan>
      <tspan x="0" dy="20" fill="#79c0ff">## </tspan><tspan fill="#c9d1d9">数据驱动决策</tspan>
      <tspan x="0" dy="26" fill="#79c0ff"># </tspan><tspan fill="#c9d1d9" font-weight="600">技术架构</tspan>
      <tspan x="0" dy="22" fill="#79c0ff">## </tspan><tspan fill="#c9d1d9">前端：React + TS</tspan>
      <tspan x="0" dy="20" fill="#79c0ff">## </tspan><tspan fill="#c9d1d9">后端：Go 微服务</tspan>
      <tspan x="0" dy="18" fill="#c9d1d9">- </tspan><tspan fill="#8b949e">gRPC 通信</tspan>
      <tspan x="0" dy="16" fill="#c9d1d9">- </tspan><tspan fill="#8b949e">K8s 部署</tspan>
      <tspan x="0" dy="20" fill="#79c0ff">## </tspan><tspan fill="#c9d1d9">数据库：PostgreSQL</tspan>
    </text>
  </g>
  <!-- Bottom status bar -->
  <rect x="40" y="350" width="720" height="20" rx="0" fill="#21262d"/>
  <text x="60" y="363" font-family="monospace" font-size="9" fill="#4ade80">✓ 层级结构完整保留</text>
  <text x="680" y="363" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="end">UTF-8 · Markdown</text>
</svg>
