<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Style: Isometric 3D - documents flowing from cloud to laptop -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#sky)"/>
  <!-- Floor plane -->
  <path d="M0 320 L400 380 L800 320 L800 400 L0 400Z" fill="#0f0a2a"/>
  <!-- Isometric laptop (right side) -->
  <g transform="translate(480, 180)">
    <!-- Screen -->
    <path d="M0 0 L160 -30 L160 80 L0 110Z" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <!-- Screen content - green checkmarks -->
    <path d="M20 15 L140 0" stroke="#4ade80" stroke-width="1.5" opacity="0.6"/>
    <path d="M20 30 L130 15" stroke="#4ade80" stroke-width="1.5" opacity="0.5"/>
    <path d="M20 45 L120 30" stroke="#4ade80" stroke-width="1.5" opacity="0.4"/>
    <path d="M20 60 L135 45" stroke="#4ade80" stroke-width="1.5" opacity="0.6"/>
    <path d="M20 75 L110 60" stroke="#4ade80" stroke-width="1.5" opacity="0.5"/>
    <!-- Progress bar -->
    <rect x="20" y="85" width="120" height="8" rx="4" fill="#1e1b4b"/>
    <rect x="20" y="85" width="100" height="8" rx="4" fill="#4ade80"/>
    <text x="80" y="92" font-family="system-ui" font-size="6" fill="#fff" text-anchor="middle">87%</text>
    <!-- Base -->
    <path d="M0 110 L160 80 L220 100 L60 130Z" fill="#334155" stroke="#475569" stroke-width="1"/>
  </g>
  <!-- Flying documents (various colors, different sizes, scattered) -->
  <g>
    <!-- Doc 1 - large, close -->
    <g transform="translate(280, 120) rotate(-15)">
      <rect width="45" height="55" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="8" y="10" width="28" height="3" rx="1.5" fill="#d97706"/>
      <rect x="8" y="18" width="22" height="2" rx="1" fill="#d97706" opacity="0.6"/>
      <rect x="8" y="24" width="25" height="2" rx="1" fill="#d97706" opacity="0.6"/>
      <rect x="12" y="30" width="18" height="2" rx="1" fill="#d97706" opacity="0.4"/>
    </g>
    <!-- Doc 2 -->
    <g transform="translate(330, 80) rotate(-8)">
      <rect width="38" height="48" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="7" y="9" width="24" height="3" rx="1.5" fill="#2563eb"/>
      <rect x="7" y="16" width="18" height="2" rx="1" fill="#2563eb" opacity="0.6"/>
      <rect x="7" y="22" width="20" height="2" rx="1" fill="#2563eb" opacity="0.5"/>
    </g>
    <!-- Doc 3 -->
    <g transform="translate(370, 150) rotate(-5)">
      <rect width="40" height="50" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
      <rect x="7" y="9" width="26" height="3" rx="1.5" fill="#16a34a"/>
      <rect x="7" y="16" width="20" height="2" rx="1" fill="#16a34a" opacity="0.6"/>
      <rect x="11" y="22" width="15" height="2" rx="1" fill="#16a34a" opacity="0.4"/>
    </g>
    <!-- Doc 4 - small, far -->
    <g transform="translate(310, 170) rotate(-20)">
      <rect width="30" height="38" rx="2" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
      <rect x="5" y="7" width="20" height="2.5" rx="1" fill="#db2777"/>
      <rect x="5" y="13" width="15" height="2" rx="1" fill="#db2777" opacity="0.5"/>
    </g>
    <!-- Doc 5 -->
    <g transform="translate(400, 100) rotate(5)">
      <rect width="35" height="44" rx="2" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
      <rect x="6" y="8" width="22" height="2.5" rx="1" fill="#4f46e5"/>
      <rect x="6" y="14" width="18" height="2" rx="1" fill="#4f46e5" opacity="0.5"/>
      <rect x="6" y="20" width="20" height="2" rx="1" fill="#4f46e5" opacity="0.4"/>
    </g>
    <!-- Doc 6 -->
    <g transform="translate(420, 190) rotate(8)">
      <rect width="32" height="40" rx="2" fill="#fef9c3" stroke="#eab308" stroke-width="1"/>
      <rect x="5" y="7" width="20" height="2.5" rx="1" fill="#ca8a04"/>
      <rect x="5" y="13" width="16" height="2" rx="1" fill="#ca8a04" opacity="0.5"/>
    </g>
  </g>
  <!-- Cloud (left side, stylized) -->
  <g transform="translate(80, 80)">
    <ellipse cx="80" cy="70" rx="80" ry="50" fill="#4338ca" opacity="0.3"/>
    <ellipse cx="60" cy="60" rx="55" ry="40" fill="#4338ca" opacity="0.4"/>
    <ellipse cx="100" cy="55" rx="50" ry="35" fill="#4338ca" opacity="0.5"/>
    <ellipse cx="80" cy="50" rx="60" ry="35" fill="#5b21b6" opacity="0.6"/>
    <!-- Cloud icon -->
    <text x="80" y="60" font-family="system-ui" font-size="24" fill="#c4b5fd" text-anchor="middle">☁</text>
    <text x="80" y="85" font-family="system-ui" font-size="11" fill="#a78bfa" text-anchor="middle">500 篇笔记</text>
  </g>
  <!-- Motion lines -->
  <g stroke="#a78bfa" stroke-width="1.5" opacity="0.4" stroke-linecap="round">
    <path d="M200 130 C260 120 320 140 380 160" fill="none" stroke-dasharray="4,6"/>
    <path d="M190 160 C250 155 320 170 400 180" fill="none" stroke-dasharray="4,6"/>
    <path d="M210 100 C270 95 350 110 420 130" fill="none" stroke-dasharray="4,6"/>
  </g>
  <!-- Badge -->
  <rect x="520" y="320" width="160" height="40" rx="20" fill="#7c3aed"/>
  <text x="600" y="345" font-family="system-ui" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">20 分钟全部搞定</text>
</svg>
