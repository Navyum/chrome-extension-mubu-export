<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Style: Radar/spider chart comparison -->
  <rect width="800" height="400" fill="#0f172a"/>
  <!-- Radar chart center -->
  <g transform="translate(400, 210)">
    <!-- Grid rings -->
    <polygon points="0,-130 113,-65 113,65 0,130 -113,65 -113,-65" fill="none" stroke="#334155" stroke-width="1"/>
    <polygon points="0,-97 85,-49 85,49 0,97 -85,49 -85,-49" fill="none" stroke="#334155" stroke-width="0.7" opacity="0.7"/>
    <polygon points="0,-65 56,-33 56,33 0,65 -56,33 -56,-33" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.5"/>
    <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3"/>
    <!-- Axis lines -->
    <line x1="0" y1="0" x2="0" y2="-135" stroke="#475569" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="117" y2="-68" stroke="#475569" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="117" y2="68" stroke="#475569" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="0" y2="135" stroke="#475569" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-117" y2="68" stroke="#475569" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="-117" y2="-68" stroke="#475569" stroke-width="0.5"/>
    <!-- Axis labels -->
    <text x="0" y="-145" font-family="system-ui" font-size="10" fill="#e2e8f0" text-anchor="middle">编辑体验</text>
    <text x="130" y="-68" font-family="system-ui" font-size="10" fill="#e2e8f0">数据导出</text>
    <text x="130" y="78" font-family="system-ui" font-size="10" fill="#e2e8f0">插件生态</text>
    <text x="0" y="155" font-family="system-ui" font-size="10" fill="#e2e8f0" text-anchor="middle">离线支持</text>
    <text x="-130" y="78" font-family="system-ui" font-size="10" fill="#e2e8f0" text-anchor="end">免费程度</text>
    <text x="-130" y="-68" font-family="system-ui" font-size="10" fill="#e2e8f0" text-anchor="end">协作能力</text>
    <!-- Mubu polygon (purple) -->
    <polygon points="0,-117 85,-49 56,33 0,65 -85,49 -99,-57" fill="#a855f7" opacity="0.15" stroke="#a855f7" stroke-width="2"/>
    <!-- Obsidian polygon (blue) -->
    <polygon points="0,-97 113,-65 113,65 0,130 -113,65 -56,-33" fill="#818cf8" opacity="0.12" stroke="#818cf8" stroke-width="2"/>
    <!-- Logseq polygon (cyan) -->
    <polygon points="0,-65 56,-33 56,33 0,130 -113,65 -56,-33" fill="#22d3ee" opacity="0.1" stroke="#22d3ee" stroke-width="1.5"/>
    <!-- WorkFlowy polygon (amber) -->
    <polygon points="0,-130 28,-16 28,16 0,32 -56,33 -28,-16" fill="#fbbf24" opacity="0.1" stroke="#fbbf24" stroke-width="1.5"/>
  </g>
  <!-- Legend -->
  <g transform="translate(40, 30)">
    <text x="0" y="14" font-family="system-ui" font-size="14" fill="#e2e8f0" font-weight="700">大纲工具横评</text>
    <rect x="0" y="28" width="14" height="14" rx="3" fill="#a855f7" opacity="0.6"/>
    <text x="20" y="39" font-family="system-ui" font-size="10" fill="#c4b5fd">幕布</text>
    <rect x="60" y="28" width="14" height="14" rx="3" fill="#818cf8" opacity="0.6"/>
    <text x="80" y="39" font-family="system-ui" font-size="10" fill="#c7d2fe">Obsidian</text>
    <rect x="140" y="28" width="14" height="14" rx="3" fill="#22d3ee" opacity="0.6"/>
    <text x="160" y="39" font-family="system-ui" font-size="10" fill="#a5f3fc">Logseq</text>
    <rect x="210" y="28" width="14" height="14" rx="3" fill="#fbbf24" opacity="0.6"/>
    <text x="230" y="39" font-family="system-ui" font-size="10" fill="#fef3c7">WorkFlowy</text>
  </g>
  <!-- Insight callout -->
  <rect x="560" y="30" width="200" height="50" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="660" y="52" font-family="system-ui" font-size="10" fill="#94a3b8" text-anchor="middle">💡 没有绝对最好</text>
  <text x="660" y="68" font-family="system-ui" font-size="9" fill="#64748b" text-anchor="middle">看场景选工具</text>
</svg>
