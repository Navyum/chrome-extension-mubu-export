<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Style: Office/enterprise themed - team collaboration visual -->
  <rect width="800" height="400" fill="#0f172a"/>
  <!-- Office grid background -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
  </g>
  <!-- Left: Mubu with team avatars -->
  <g transform="translate(60, 70)">
    <rect width="250" height="250" rx="14" fill="#1e1040" stroke="#a855f7" stroke-width="2"/>
    <rect width="250" height="34" rx="14" fill="#3b0764"/>
    <rect x="0" y="22" width="250" height="12" fill="#3b0764"/>
    <text x="125" y="24" font-family="system-ui" font-size="11" fill="#e9d5ff" text-anchor="middle" font-weight="500">幕布 · 个人笔记</text>
    <!-- Team member indicators -->
    <circle cx="30" cy="55" r="10" fill="#7c3aed" opacity="0.3"/>
    <text x="30" y="59" font-family="system-ui" font-size="9" fill="#c084fc" text-anchor="middle">A</text>
    <!-- Document list -->
    <g transform="translate(20, 75)">
      <rect width="210" height="28" rx="6" fill="#2a1060" stroke="#6d28d9" stroke-width="0.5"/>
      <text x="10" y="18" font-family="system-ui" font-size="9" fill="#c4b5fd">📋 Q1 产品规划</text>
      <rect y="35" width="210" height="28" rx="6" fill="#2a1060" stroke="#6d28d9" stroke-width="0.5"/>
      <text x="10" y="53" font-family="system-ui" font-size="9" fill="#c4b5fd">📋 竞品分析报告</text>
      <rect y="70" width="210" height="28" rx="6" fill="#2a1060" stroke="#6d28d9" stroke-width="0.5"/>
      <text x="10" y="88" font-family="system-ui" font-size="9" fill="#c4b5fd">📋 技术方案评审</text>
      <rect y="105" width="210" height="28" rx="6" fill="#2a1060" stroke="#6d28d9" stroke-width="0.5"/>
      <text x="10" y="123" font-family="system-ui" font-size="9" fill="#c4b5fd">📋 周会纪要合集</text>
      <rect y="140" width="210" height="28" rx="6" fill="#2a1060" stroke="#6d28d9" stroke-width="0.5"/>
      <text x="10" y="158" font-family="system-ui" font-size="9" fill="#c4b5fd">📋 OKR 追踪表</text>
    </g>
  </g>
  <!-- Center: Migration flow with team -->
  <g transform="translate(340, 130)">
    <!-- Multiple arrows (team migration) -->
    <path d="M0 40 L100 40" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0 70 L100 70" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M0 100 L100 100" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M90 33 L105 40 L90 47" fill="#38bdf8"/>
    <path d="M90 63 L105 70 L90 77" fill="#38bdf8" opacity="0.7"/>
    <path d="M90 93 L105 100 L90 107" fill="#38bdf8" opacity="0.5"/>
    <!-- Team avatars migrating -->
    <circle cx="20" cy="40" r="8" fill="#0ea5e9" opacity="0.5"/>
    <circle cx="35" cy="70" r="7" fill="#0ea5e9" opacity="0.4"/>
    <circle cx="25" cy="100" r="6" fill="#0ea5e9" opacity="0.3"/>
    <text x="50" y="135" font-family="system-ui" font-size="9" fill="#7dd3fc" text-anchor="middle">团队批量迁移</text>
  </g>
  <!-- Right: Feishu docs -->
  <g transform="translate(470, 70)">
    <rect width="270" height="250" rx="14" fill="#0f2318" stroke="#4ade80" stroke-width="2"/>
    <rect width="270" height="34" rx="14" fill="#14532d"/>
    <rect x="0" y="22" width="270" height="12" fill="#14532d"/>
    <text x="135" y="24" font-family="system-ui" font-size="11" fill="#86efac" text-anchor="middle" font-weight="500">飞书 · 团队知识库</text>
    <!-- Feishu sidebar + content -->
    <rect x="10" y="45" width="60" height="195" rx="6" fill="#052e16" stroke="#166534" stroke-width="0.5"/>
    <text x="40" y="65" font-family="system-ui" font-size="8" fill="#6ee7b7" text-anchor="middle">知识库</text>
    <rect x="15" y="75" width="50" height="16" rx="4" fill="#166534"/>
    <text x="40" y="87" font-family="system-ui" font-size="7" fill="#a7f3d0" text-anchor="middle">产品</text>
    <rect x="15" y="97" width="50" height="16" rx="4" fill="#0a3622"/>
    <text x="40" y="109" font-family="system-ui" font-size="7" fill="#6ee7b7" text-anchor="middle">技术</text>
    <rect x="15" y="119" width="50" height="16" rx="4" fill="#0a3622"/>
    <text x="40" y="131" font-family="system-ui" font-size="7" fill="#6ee7b7" text-anchor="middle">运营</text>
    <!-- Content area -->
    <rect x="80" y="45" width="180" height="195" rx="6" fill="#052e16" stroke="#166534" stroke-width="0.5"/>
    <text x="170" y="68" font-family="system-ui" font-size="10" fill="#86efac" text-anchor="middle" font-weight="600">Q1 产品规划</text>
    <rect x="95" y="80" width="150" height="6" rx="3" fill="#4ade80" opacity="0.3"/>
    <rect x="95" y="92" width="130" height="5" rx="2.5" fill="#4ade80" opacity="0.2"/>
    <rect x="95" y="104" width="140" height="5" rx="2.5" fill="#4ade80" opacity="0.2"/>
    <rect x="95" y="120" width="100" height="20" rx="4" fill="#166534" stroke="#4ade80" stroke-width="0.5"/>
    <text x="145" y="134" font-family="system-ui" font-size="8" fill="#6ee7b7" text-anchor="middle">@团队成员 评论</text>
    <rect x="95" y="150" width="150" height="6" rx="3" fill="#4ade80" opacity="0.3"/>
    <rect x="95" y="162" width="120" height="5" rx="2.5" fill="#4ade80" opacity="0.2"/>
    <!-- Collaboration indicators -->
    <circle cx="240" cy="65" r="8" fill="#4ade80" opacity="0.3"/>
    <circle cx="252" cy="65" r="8" fill="#4ade80" opacity="0.3"/>
    <circle cx="248" cy="65" r="8" fill="#4ade80" opacity="0.2"/>
  </g>
  <!-- Bottom text -->
  <text x="400" y="375" font-family="system-ui" font-size="12" fill="#94a3b8" text-anchor="middle">企业团队 · 从个人笔记到协作知识库</text>
</svg>
