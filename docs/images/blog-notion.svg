<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Style: Split screen with Notion's signature black/white aesthetic meeting Mubu's purple -->
  <rect width="800" height="400" fill="#1a1a2e"/>
  <!-- Left: Mubu (purple world) -->
  <rect x="40" y="50" width="320" height="300" rx="16" fill="#1e1040" stroke="#a855f7" stroke-width="2"/>
  <rect x="40" y="50" width="320" height="36" rx="16" fill="#3b0764"/>
  <rect x="40" y="74" width="320" height="12" fill="#3b0764"/>
  <text x="200" y="74" font-family="system-ui" font-size="12" fill="#e9d5ff" text-anchor="middle" font-weight="600">mubu.com</text>
  <!-- Outline nodes -->
  <g transform="translate(65, 100)">
    <circle cx="8" cy="8" r="5" fill="#a855f7"/>
    <rect x="20" y="4" width="120" height="7" rx="3.5" fill="#c084fc" opacity="0.8"/>
    <line x1="8" y1="16" x2="8" y2="32" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"/>
    <circle cx="22" cy="35" r="4" fill="#8b5cf6"/>
    <rect x="32" y="31" width="90" height="6" rx="3" fill="#a78bfa" opacity="0.6"/>
    <circle cx="22" cy="55" r="4" fill="#8b5cf6"/>
    <rect x="32" y="51" width="100" height="6" rx="3" fill="#a78bfa" opacity="0.6"/>
    <line x1="22" y1="63" x2="22" y2="76" stroke="#6d28d9" stroke-width="1" opacity="0.3"/>
    <circle cx="36" cy="78" r="3" fill="#7c3aed" opacity="0.7"/>
    <rect x="44" y="75" width="70" height="5" rx="2.5" fill="#8b5cf6" opacity="0.4"/>
    <circle cx="8" cy="105" r="5" fill="#a855f7"/>
    <rect x="20" y="101" width="140" height="7" rx="3.5" fill="#c084fc" opacity="0.8"/>
    <line x1="8" y1="113" x2="8" y2="130" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"/>
    <circle cx="22" cy="133" r="4" fill="#8b5cf6"/>
    <rect x="32" y="129" width="80" height="6" rx="3" fill="#a78bfa" opacity="0.6"/>
    <circle cx="22" cy="155" r="4" fill="#8b5cf6"/>
    <rect x="32" y="151" width="110" height="6" rx="3" fill="#a78bfa" opacity="0.6"/>
  </g>
  <!-- Center: Transfer animation -->
  <g transform="translate(370, 155)">
    <rect width="60" height="90" rx="12" fill="#16213e" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Step indicators -->
    <text x="30" y="22" font-family="system-ui" font-size="8" fill="#7dd3fc" text-anchor="middle">STEP 1</text>
    <text x="30" y="36" font-family="monospace" font-size="7" fill="#94a3b8" text-anchor="middle">.md 导出</text>
    <line x1="15" y1="44" x2="45" y2="44" stroke="#334155" stroke-width="0.5"/>
    <text x="30" y="58" font-family="system-ui" font-size="8" fill="#7dd3fc" text-anchor="middle">STEP 2</text>
    <text x="30" y="72" font-family="monospace" font-size="7" fill="#94a3b8" text-anchor="middle">导入 Notion</text>
    <!-- Arrows -->
    <path d="M-15 45 L-2 45" stroke="#a855f7" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M62 45 L75 45" stroke="#000" stroke-width="2" marker-end="url(#arr2)"/>
  </g>
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#a855f7"/></marker>
    <marker id="arr2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#000"/></marker>
  </defs>
  <!-- Right: Notion (black/white world) -->
  <rect x="440" y="50" width="320" height="300" rx="16" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
  <rect x="440" y="50" width="320" height="36" rx="16" fill="#f7f7f5"/>
  <rect x="440" y="74" width="320" height="12" fill="#f7f7f5"/>
  <text x="600" y="74" font-family="system-ui" font-size="12" fill="#37352f" text-anchor="middle" font-weight="600">Notion</text>
  <!-- Notion page content -->
  <g transform="translate(465, 100)">
    <rect x="0" y="0" width="22" height="22" rx="4" fill="#f7f7f5" stroke="#e3e3e0" stroke-width="1"/>
    <text x="11" y="16" font-family="system-ui" font-size="12" fill="#37352f" text-anchor="middle">📄</text>
    <text x="30" y="15" font-family="system-ui" font-size="13" fill="#37352f" font-weight="600">项目管理笔记</text>
    <!-- Notion blocks -->
    <rect x="0" y="35" width="260" height="1" fill="#e3e3e0"/>
    <text x="0" y="55" font-family="system-ui" font-size="11" fill="#37352f">H1 需求分析</text>
    <rect x="15" y="65" width="180" height="8" rx="2" fill="#f1f1ef"/>
    <rect x="15" y="79" width="160" height="8" rx="2" fill="#f1f1ef"/>
    <text x="0" y="106" font-family="system-ui" font-size="11" fill="#37352f">H1 技术选型</text>
    <rect x="15" y="116" width="200" height="8" rx="2" fill="#f1f1ef"/>
    <rect x="30" y="130" width="140" height="7" rx="2" fill="#f7f7f5" stroke="#e3e3e0" stroke-width="0.5"/>
    <rect x="30" y="143" width="150" height="7" rx="2" fill="#f7f7f5" stroke="#e3e3e0" stroke-width="0.5"/>
    <text x="0" y="172" font-family="system-ui" font-size="11" fill="#37352f">H1 学习笔记</text>
    <rect x="15" y="182" width="170" height="8" rx="2" fill="#f1f1ef"/>
    <!-- Notion sidebar indicator -->
    <rect x="240" y="0" width="3" height="200" rx="1.5" fill="#e3e3e0"/>
  </g>
  <!-- Bottom badge -->
  <rect x="300" y="365" width="200" height="28" rx="14" fill="#312e81"/>
  <text x="400" y="383" font-family="system-ui" font-size="11" fill="#c7d2fe" text-anchor="middle" font-weight="500">Markdown 中转 · 无损导入</text>
</svg>
