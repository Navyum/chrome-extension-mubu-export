<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Style: Weather metaphor - umbrella protecting from data rain -->
  <rect width="800" height="400" fill="#0c0f1a"/>
  <!-- Rain (data loss risks) -->
  <g stroke="#ef4444" stroke-width="1.5" opacity="0.3" stroke-linecap="round">
    <line x1="120" y1="0" x2="110" y2="40"/><line x1="200" y1="10" x2="190" y2="50"/>
    <line x1="350" y1="0" x2="340" y2="35"/><line x1="500" y1="5" x2="490" y2="40"/>
    <line x1="600" y1="0" x2="590" y2="45"/><line x1="700" y1="10" x2="690" y2="50"/>
    <line x1="80" y1="30" x2="70" y2="65"/><line x1="450" y1="20" x2="440" y2="55"/>
    <line x1="650" y1="25" x2="640" y2="60"/>
  </g>
  <!-- Danger labels falling -->
  <g font-family="system-ui" font-size="9" opacity="0.5">
    <text x="90" y="80" fill="#fca5a5" transform="rotate(-10, 90, 80)">账号封禁</text>
    <text x="220" y="60" fill="#fca5a5" transform="rotate(-5, 220, 60)">服务中断</text>
    <text x="550" y="55" fill="#fca5a5" transform="rotate(-8, 550, 55)">误删数据</text>
    <text x="680" y="70" fill="#fca5a5" transform="rotate(-12, 680, 70)">格式锁定</text>
  </g>
  <!-- Large umbrella (protection) -->
  <g transform="translate(400, 100)">
    <!-- Umbrella canopy -->
    <path d="M-180 80 C-180 -20 -90 -60 0 -60 C90 -60 180 -20 180 80" fill="#059669" opacity="0.8"/>
    <path d="M-180 80 C-180 -20 -90 -60 0 -60 C90 -60 180 -20 180 80" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <!-- Umbrella ribs -->
    <line x1="0" y1="-60" x2="-150" y2="75" stroke="#10b981" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="-60" x2="-75" y2="80" stroke="#10b981" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="-60" x2="0" y2="80" stroke="#10b981" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="-60" x2="75" y2="80" stroke="#10b981" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="-60" x2="150" y2="75" stroke="#10b981" stroke-width="1" opacity="0.3"/>
    <!-- Pole -->
    <line x1="0" y1="-60" x2="0" y2="200" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round"/>
    <!-- Handle -->
    <path d="M0 200 C0 215 -10 220 -15 215" fill="none" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round"/>
    <!-- Label on canopy -->
    <text x="0" y="20" font-family="system-ui" font-size="14" fill="#ecfdf5" text-anchor="middle" font-weight="600">定期备份</text>
    <text x="0" y="42" font-family="system-ui" font-size="10" fill="#a7f3d0" text-anchor="middle">每月 5 分钟</text>
  </g>
  <!-- Protected documents underneath -->
  <g transform="translate(300, 300)">
    <!-- Document stack -->
    <rect x="0" y="0" width="50" height="60" rx="4" fill="#1e293b" stroke="#6ee7b7" stroke-width="1.5"/>
    <rect x="8" y="10" width="30" height="4" rx="2" fill="#6ee7b7" opacity="0.5"/>
    <rect x="8" y="18" width="24" height="3" rx="1.5" fill="#6ee7b7" opacity="0.3"/>
    <rect x="8" y="25" width="28" height="3" rx="1.5" fill="#6ee7b7" opacity="0.3"/>

    <rect x="65" y="-5" width="50" height="60" rx="4" fill="#1e293b" stroke="#6ee7b7" stroke-width="1.5"/>
    <rect x="73" y="5" width="30" height="4" rx="2" fill="#6ee7b7" opacity="0.5"/>
    <rect x="73" y="13" width="22" height="3" rx="1.5" fill="#6ee7b7" opacity="0.3"/>

    <rect x="130" y="5" width="50" height="60" rx="4" fill="#1e293b" stroke="#6ee7b7" stroke-width="1.5"/>
    <rect x="138" y="15" width="30" height="4" rx="2" fill="#6ee7b7" opacity="0.5"/>
    <rect x="138" y="23" width="26" height="3" rx="1.5" fill="#6ee7b7" opacity="0.3"/>
    <rect x="138" y="30" width="20" height="3" rx="1.5" fill="#6ee7b7" opacity="0.3"/>

    <text x="100" y="80" font-family="system-ui" font-size="10" fill="#86efac" text-anchor="middle">✓ 安全</text>
  </g>
  <!-- Bottom text -->
  <text x="400" y="385" font-family="system-ui" font-size="11" fill="#64748b" text-anchor="middle">3-2-1 备份原则 · 知识资产永远有 Plan B</text>
</svg>
