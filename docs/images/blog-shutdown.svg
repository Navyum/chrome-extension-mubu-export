<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Style: Timeline showing cloud services shutting down, with a safety net -->
  <rect width="800" height="400" fill="#0f0a1a"/>
  <!-- Timeline axis -->
  <line x1="80" y1="180" x2="720" y2="180" stroke="#334155" stroke-width="2"/>
  <!-- Past shutdowns (faded red markers) -->
  <g>
    <circle cx="150" cy="180" r="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="150" y1="172" x2="150" y2="120" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    <rect x="110" y="95" width="80" height="22" rx="4" fill="#1c1917" stroke="#ef4444" stroke-width="1"/>
    <text x="150" y="110" font-family="system-ui" font-size="8" fill="#fca5a5" text-anchor="middle">轻记 关停</text>
    <text x="150" y="200" font-family="system-ui" font-size="8" fill="#64748b" text-anchor="middle">2020</text>
  </g>
  <g>
    <circle cx="280" cy="180" r="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="280" y1="172" x2="280" y2="120" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    <rect x="235" y="95" width="90" height="22" rx="4" fill="#1c1917" stroke="#ef4444" stroke-width="1"/>
    <text x="280" y="110" font-family="system-ui" font-size="8" fill="#fca5a5" text-anchor="middle">为知笔记 收费</text>
    <text x="280" y="200" font-family="system-ui" font-size="8" fill="#64748b" text-anchor="middle">2021</text>
  </g>
  <g>
    <circle cx="410" cy="180" r="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="410" y1="172" x2="410" y2="120" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
    <rect x="365" y="95" width="90" height="22" rx="4" fill="#1c1917" stroke="#ef4444" stroke-width="1"/>
    <text x="410" y="110" font-family="system-ui" font-size="8" fill="#fca5a5" text-anchor="middle">语雀 宕机事件</text>
    <text x="410" y="200" font-family="system-ui" font-size="8" fill="#64748b" text-anchor="middle">2023</text>
  </g>
  <!-- Future (question mark - Mubu) -->
  <g>
    <circle cx="560" cy="180" r="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="2"/>
    <text x="560" y="185" font-family="system-ui" font-size="12" fill="#c084fc" text-anchor="middle" font-weight="700">?</text>
    <text x="560" y="200" font-family="system-ui" font-size="9" fill="#a855f7" text-anchor="middle">幕布</text>
    <text x="560" y="215" font-family="system-ui" font-size="8" fill="#64748b" text-anchor="middle">2025+</text>
  </g>
  <!-- Safety net below timeline -->
  <g transform="translate(0, 30)">
    <!-- Net shape -->
    <path d="M200 250 Q300 280 400 270 Q500 260 600 280 Q650 290 680 285" fill="none" stroke="#4ade80" stroke-width="2" opacity="0.6"/>
    <path d="M220 270 Q320 300 400 290 Q480 280 580 300 Q640 310 660 305" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.4"/>
    <!-- Cross lines of net -->
    <line x1="280" y1="250" x2="300" y2="295" stroke="#4ade80" stroke-width="1" opacity="0.3"/>
    <line x1="360" y1="255" x2="370" y2="290" stroke="#4ade80" stroke-width="1" opacity="0.3"/>
    <line x1="440" y1="252" x2="445" y2="285" stroke="#4ade80" stroke-width="1" opacity="0.3"/>
    <line x1="520" y1="258" x2="530" y2="295" stroke="#4ade80" stroke-width="1" opacity="0.3"/>
    <line x1="600" y1="265" x2="605" y2="300" stroke="#4ade80" stroke-width="1" opacity="0.3"/>
  </g>
  <!-- 3 steps at bottom -->
  <g transform="translate(130, 320)">
    <circle cx="0" cy="15" r="14" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="0" y="19" font-family="system-ui" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="700">1</text>
    <text x="25" y="19" font-family="system-ui" font-size="10" fill="#86efac">全量备份</text>
  </g>
  <g transform="translate(330, 320)">
    <circle cx="0" cy="15" r="14" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="0" y="19" font-family="system-ui" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="700">2</text>
    <text x="25" y="19" font-family="system-ui" font-size="10" fill="#86efac">定期机制</text>
  </g>
  <g transform="translate(530, 320)">
    <circle cx="0" cy="15" r="14" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="0" y="19" font-family="system-ui" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="700">3</text>
    <text x="25" y="19" font-family="system-ui" font-size="10" fill="#86efac">迁移预案</text>
  </g>
  <!-- Title -->
  <text x="400" y="35" font-family="system-ui" font-size="15" fill="#e2e8f0" text-anchor="middle" font-weight="700">云笔记停服时间线 — 你准备好了吗？</text>
</svg>
