<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Style: Pricing tier comparison with lock/unlock metaphor -->
  <rect width="800" height="400" fill="#0f172a"/>
  <!-- Title -->
  <text x="400" y="40" font-family="system-ui" font-size="16" fill="#e2e8f0" text-anchor="middle" font-weight="700">免费版 vs 会员版</text>
  <!-- Free tier (left, locked features) -->
  <g transform="translate(80, 65)">
    <rect width="280" height="290" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <!-- Header -->
    <rect width="280" height="45" rx="16" fill="#334155"/>
    <rect x="0" y="30" width="280" height="15" fill="#334155"/>
    <text x="140" y="32" font-family="system-ui" font-size="14" fill="#e2e8f0" text-anchor="middle" font-weight="600">免费版</text>
    <text x="140" y="52" font-family="system-ui" font-size="11" fill="#94a3b8" text-anchor="middle">¥0 / 永久</text>
    <!-- Feature list with locks -->
    <g transform="translate(20, 70)" font-family="system-ui" font-size="10">
      <text x="0" y="0" fill="#94a3b8">✓ 基础大纲编辑</text>
      <text x="0" y="26" fill="#94a3b8">✓ 300 篇文档上限</text>
      <text x="0" y="52" fill="#ef4444">🔒 无批量导出</text>
      <text x="0" y="78" fill="#ef4444">🔒 仅 OPML/FreeMind 格式</text>
      <text x="0" y="104" fill="#ef4444">🔒 无 Markdown 导出</text>
      <text x="0" y="130" fill="#ef4444">🔒 协作 2 人限制</text>
      <text x="0" y="156" fill="#94a3b8">✓ 基础模板</text>
      <text x="0" y="182" fill="#ef4444">🔒 100MB 存储空间</text>
    </g>
    <!-- Frustration indicator -->
    <rect x="60" y="260" width="160" height="22" rx="11" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="140" y="275" font-family="system-ui" font-size="9" fill="#fca5a5" text-anchor="middle">导出受限 😤</text>
  </g>
  <!-- Pro tier (right, all unlocked) -->
  <g transform="translate(440, 55)">
    <rect width="280" height="300" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="2.5"/>
    <!-- Header with crown -->
    <rect width="280" height="50" rx="16" fill="#422006"/>
    <rect x="0" y="34" width="280" height="16" fill="#422006"/>
    <text x="125" y="35" font-family="system-ui" font-size="14" fill="#fef3c7" text-anchor="middle" font-weight="600">会员版</text>
    <text x="155" y="33" font-family="system-ui" font-size="14">👑</text>
    <text x="140" y="55" font-family="system-ui" font-size="11" fill="#fcd34d" text-anchor="middle">¥90 / 年</text>
    <!-- Feature list unlocked -->
    <g transform="translate(20, 75)" font-family="system-ui" font-size="10">
      <text x="0" y="0" fill="#4ade80">✓ 高级大纲 + 思维导图</text>
      <text x="0" y="26" fill="#4ade80">✓ 无限文档</text>
      <text x="0" y="52" fill="#4ade80">✓ 批量导出（仍需逐篇）</text>
      <text x="0" y="78" fill="#4ade80">✓ 6 种格式</text>
      <text x="0" y="104" fill="#f59e0b">⚠ 仍无 Markdown 导出</text>
      <text x="0" y="130" fill="#4ade80">✓ 协作 10 人</text>
      <text x="0" y="156" fill="#4ade80">✓ 全部模板</text>
      <text x="0" y="182" fill="#4ade80">✓ 5GB 存储</text>
    </g>
    <!-- Still limited note -->
    <rect x="40" y="268" width="200" height="22" rx="11" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="140" y="283" font-family="system-ui" font-size="9" fill="#fde68a" text-anchor="middle">付费也不支持批量 MD 导出</text>
  </g>
  <!-- Bottom: Free solution callout -->
  <rect x="200" y="365" width="400" height="28" rx="14" fill="#052e16" stroke="#4ade80" stroke-width="1.5"/>
  <text x="400" y="383" font-family="system-ui" font-size="11" fill="#4ade80" text-anchor="middle" font-weight="600">💡 免费方案：Mubu Exporter 扩展（0元 · 无限制 · 5种格式）</text>
</svg>
