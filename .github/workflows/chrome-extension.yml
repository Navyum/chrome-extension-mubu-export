name: Build and Release Chrome Extension

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: '补发已有标签（例如 v1.0.6）；留空仅构建'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG && format('refs/tags/{0}', env.RELEASE_TAG) || github.ref }}
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Build extension
      run: npm run build

    - name: Create extension package
      working-directory: dist
      run: zip -r ../chrome-extension.zip . -x '*.DS_Store' '__MACOSX/*'

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: chrome-extension
        path: chrome-extension.zip
        if-no-files-found: error
        retention-days: 30

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ env.RELEASE_TAG && format('refs/tags/{0}', env.RELEASE_TAG) || github.ref }}
        persist-credentials: false

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: chrome-extension
        path: .

    - name: Extract version from tag
      id: get_version
      run: |
        VERSION="$RELEASE_TAG"
        if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Invalid version tag"
          exit 1
        fi
        node -e 'const m = require("./manifest.json"); if (process.env.RELEASE_TAG !== "v" + m.version) throw new Error("Tag and manifest version differ");'
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT

    - name: Prepare release assets
      env:
        VERSION_NUMBER: ${{ steps.get_version.outputs.version_number }}
      run: |
        mv chrome-extension.zip "chrome-extension-${VERSION_NUMBER}.zip"
        git archive --format=zip --output="source-code-${VERSION_NUMBER}.zip" HEAD

    - name: Create Release and upload assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: Chrome Extension ${{ steps.get_version.outputs.version }}
        fail_on_unmatched_files: true
        files: |
          chrome-extension-${{ steps.get_version.outputs.version_number }}.zip
          source-code-${{ steps.get_version.outputs.version_number }}.zip
        body: |
          ## 🎉 幕布导出工具 ${{ steps.get_version.outputs.version }}

          ### 📦 安装方法

          #### 方法一：Chrome Web Store（推荐）
          [Chrome 应用商店安装](https://chromewebstore.google.com/detail/ddlgkdckclmnfmolnadnjanbnkfepkmp)

          #### 方法二：开发者模式加载
          1. 下载 `chrome-extension-${{ steps.get_version.outputs.version_number }}.zip` 并解压
          2. 打开 `chrome://extensions/`，开启「开发者模式」
          3. 点击「加载已解压的扩展程序」，选择解压目录

          ### 🔧 功能特性
          - ✅ 全量导出或选择文件夹、文档导出
          - ✅ 7 种格式：Markdown / OPML / Freemind / HTML / Word / PDF / JSON
          - ✅ 完整保留文件夹层级结构
          - ✅ 实时进度显示 + 暂停/继续
          - ✅ 断点续传 + 失败重试
          - ✅ 自动 Cookie 鉴权，无需手动配置
          - ✅ 性能监控面板

          ### 🚀 使用方法
          1. 登录 [mubu.com](https://mubu.com)
          2. 点击浏览器工具栏扩展图标
          3. 点击「获取文件信息」
          4. 选择导出格式，点击「开始导出」

          ### 📋 系统要求
          - 当前稳定版 Chrome
          - 已登录幕布账号

          ### 🔒 安全说明
          - 使用幕布接口读取文档，部分格式通过幕布转换接口生成
          - 仅读取幕布 Cookie 用于鉴权

          ---

          **注意**: 请遵守幕布的服务条款，本工具仅供个人备份使用。
        draft: false
        prerelease: false

  notify:
    needs: release
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')

    steps:
    - name: Notify release
      run: |
        echo "🎉 Chrome 扩展已成功发布到 GitHub Releases!"
        echo "版本: $RELEASE_TAG"
        echo "下载地址: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
