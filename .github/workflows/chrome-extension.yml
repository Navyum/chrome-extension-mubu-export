name: Build and Release Chrome Extension

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        # 如果有package.json，安装依赖
        if [ -f "package.json" ]; then
          if [ -f "package-lock.json" ] || [ -f "npm-shrinkwrap.json" ] || [ -f "yarn.lock" ]; then
            npm ci
          else
            npm install
          fi
        fi

    - name: Validate manifest.json
      run: |
        # 检查 manifest.json 语法
        if ! python3 -m json.tool manifest.json > /dev/null; then
          echo "❌ manifest.json 语法错误"
          exit 1
        fi
        echo "✅ manifest.json 语法正确"

    - name: Check required files
      run: |
        required_files=("manifest.json" "popup.html" "popup.js" "background.js")
        for file in "${required_files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "❌ 缺少必需文件: $file"
            exit 1
          fi
        done
        echo "✅ 所有必需文件都存在"

    - name: Validate HTML files
      run: |
        for html_file in popup.html; do
          if ! grep -q "<!DOCTYPE html>\|<html" "$html_file"; then
            echo "❌ $html_file 格式异常"
            exit 1
          fi
        done
        echo "✅ HTML 文件格式正确"

    - name: Create extension package
      run: |
        zip -r chrome-extension.zip . -x "*.DS_Store" "*.git*" ".github/*" "README.md" "docs/*" "asserts/*" "node_modules/*"
        echo "✅ Chrome 扩展打包完成"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: chrome-extension
        path: chrome-extension.zip
        retention-days: 30

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: chrome-extension
        path: .

    - name: Extract version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Chrome Extension ${{ steps.get_version.outputs.version }}
        body: |
          ## 🎉 幕布导出工具 ${{ steps.get_version.outputs.version }}

          ### 📦 安装方法

          #### 方法一：Chrome Web Store（推荐）
          [Chrome 应用商店安装](https://chromewebstore.google.com/detail/ddlgkdckclmnfmolnadnjanbnkfepkmp)

          #### 方法二：开发者模式加载
          1. 下载 `chrome-extension.zip` 并解压
          2. 打开 `chrome://extensions/`，开启「开发者模式」
          3. 点击「加载已解压的扩展程序」，选择解压目录

          ### 🔧 功能特性
          - ✅ 一键批量导出所有幕布笔记
          - ✅ 5 种格式：Markdown / OPML / Freemind / HTML / JSON
          - ✅ 完整保留文件夹层级结构
          - ✅ 实时进度显示 + 暂停/继续
          - ✅ 断点续传 + 失败重试
          - ✅ 自动 Cookie 鉴权，无需手动配置
          - ✅ 性能监控面板

          ### 🚀 使用方法
          1. 登录 [mubu.com](https://mubu.com)
          2. 点击浏览器工具栏扩展图标
          3. 点击「获取文件信息」
          4. 选择导出格式，点击「开始导出」

          ### 📋 系统要求
          - Chrome 88+
          - 已登录幕布账号

          ### 🔒 安全说明
          - 所有操作在本地执行，不经过第三方服务器
          - 仅读取幕布 Cookie 用于鉴权

          ---

          **注意**: 请遵守幕布的服务条款，本工具仅供个人备份使用。
        draft: false
        prerelease: false

    - name: Upload Chrome Extension
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: chrome-extension.zip
        asset_name: chrome-extension-${{ steps.get_version.outputs.version_number }}.zip
        asset_content_type: application/zip

    - name: Create source code archive
      run: |
        # 创建源代码压缩包
        git archive --format=zip --output=source-code-${{ steps.get_version.outputs.version_number }}.zip HEAD

    - name: Upload Source Code
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: source-code-${{ steps.get_version.outputs.version_number }}.zip
        asset_name: source-code-${{ steps.get_version.outputs.version_number }}.zip
        asset_content_type: application/zip

  notify:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Notify release
      run: |
        echo "🎉 Chrome 扩展已成功发布到 GitHub Releases!"
        echo "版本: ${{ github.ref_name }}"
        echo "下载地址: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" 