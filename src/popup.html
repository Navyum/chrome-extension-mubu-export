<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=372, height=600, user-scalable=no">
  <title data-i18n="popupTitle">幕布导出工具</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="container" tabindex="-1" autofocus>
    <div class="header-actions">
      <button id="login-btn" class="top-right-btn" data-i18n-title="loginToMubu" title="前往幕布登录页">
        <img src="../asserts/login.svg" data-i18n-alt="loginAlt" alt="登录" class="btn-icon login-icon">
      </button>
      <button id="sponsor-btn" class="top-right-btn" data-i18n-title="sponsorSupport" title="❤️支持开发者">
        <img src="../asserts/sponsors.png" data-i18n-alt="sponsorAlt" alt="赞助" class="btn-icon sponsor-icon">
      </button>
      <button id="settings-btn" class="top-right-btn" data-i18n-title="openSettings" title="打开设置">
        <img src="../asserts/setting.svg" data-i18n-alt="settingsAlt" alt="设置" class="btn-icon settings-icon">
      </button>
      <button id="reset-btn" class="top-right-btn btn-exit" data-i18n-title="exitTitle" title="退出">
        <img src="../asserts/exit.svg" data-i18n-alt="exitAlt" alt="退出" class="btn-icon settings-icon">
      </button>
    </div>
    <div class="header">
      <a href="https://mubu.toolab.top/" target="_blank" data-i18n-title="visitWebsite" title="访问官网" class="header-link">
        <img src="../icons/icon48.png" data-i18n-alt="popupTitle" alt="幕布导出工具" class="header-icon">
      </a>
      <h2 data-i18n="popupTitle">幕布导出工具</h2>
    </div>

    <div class="form-group select-group">
      <label for="exportType">📄 <span data-i18n="exportFormatLabel">导出格式:</span></label>
      <div class="select-container has-icon has-selection">
        <img
          id="exportTypeIcon"
          class="select-icon is-visible"
          src="../asserts/markdown.png"
          data-i18n-alt="exportFormatIconAlt"
          alt="导出格式图标"
        />
        <select id="exportType">
          <option value="md" data-icon="../asserts/markdown.png">Markdown (.md)</option>
          <option value="opml" data-icon="../asserts/opml.png">OPML (.opml)</option>
          <option value="mm" data-icon="../asserts/xmind.png">Freemind (.mm)</option>
          <option value="html" data-icon="../asserts/html.png">HTML (.html)</option>
          <option value="docx" data-icon="../asserts/word.png">Word (.doc)</option>
          <option value="pdf" data-icon="../asserts/pdf.png">PDF (.pdf)</option>
          <option value="json" data-icon="../asserts/json.png" data-i18n="formatJson">原始结构 (.json)</option>
        </select>
        <button
          type="button"
          id="exportTypeTrigger"
          class="select-trigger"
          aria-haspopup="listbox"
          aria-controls="exportTypeOptions"
          aria-expanded="false"
          hidden
        >
          <span id="exportTypeLabel" class="select-trigger-text">Markdown (.md)</span>
        </button>
        <ul id="exportTypeOptions" class="select-options" role="listbox" hidden></ul>
      </div>
    </div>

    <div id="fileInfo" class="file-info">
      <span class="file-stat-label">📄 <span data-i18n="docLabel">文档</span>:</span>
      <span id="totalFiles" class="file-stat-value">0</span>
      <span class="file-stat-sep">|</span>
      <span class="file-stat-label">🗂️ <span data-i18n="folderLabel">文件夹</span>:</span>
      <span id="folderCount" class="file-stat-value">0</span>
    </div>

    <div class="form-group">
      <button id="getInfo" type="button" class="btn btn-primary">
        <span data-i18n="getFileInfoBtn">🔍 获取文件信息</span>
      </button>
    </div>

    <div class="form-group action-buttons">
      <button id="startExport" type="button" class="btn btn-start">
        <span data-i18n="startExport">🚀 开始导出</span>
      </button>
      <button id="pauseExport" type="button" class="btn btn-pause" style="display: none;">
        <span data-i18n="pauseExport">暂停导出</span>
      </button>
    </div>

    <div id="retrySection" style="display:none;" class="form-group">
      <button id="retryFailedBtn" type="button" class="btn btn-retry">
        <span data-i18n="retryFailed">🔄 重试失败的文件</span>
      </button>
      <div id="failedList"></div>
    </div>

    <div class="progress-bar" id="progressBar" style="display: none;">
      <div class="progress-fill" id="progressFill"></div>
      <div class="progress-text" id="progressText"></div>
    </div>

    <div id="status" class="status" style="display: none;"></div>

    <div class="log-container" id="logContainer">
      <div class="log-placeholder">
        <p>👏👏👏</p>
        <p data-i18n="welcomeTitle">欢迎使用幕布导出工具！</p>
        <p class="log-tip">✨ <span data-i18n="welcomeTip1">请先前往幕布登录</span></p>
        <p class="log-tip">✨ <span data-i18n="welcomeTip2">点击🔍获取信息后，点击🚀按钮开始导出</span></p>
        <p class="log-tip">✨ <span data-i18n="welcomeTip3">Tips：点击 ⚙️ 可以设置导出目录</span></p>
        <p class="log-tip">✨ <span data-i18n="welcomeTip4">Tips：点击 ❤️ 支持开发者</span></p>
      </div>
    </div>
  </div>

  <!-- Rating Modal -->
  <div id="ratingModal" class="rating-modal" inert>
    <div class="rating-modal-card" role="dialog" aria-modal="true" aria-labelledby="ratingTitle">
      <button id="ratingModalClose" class="sponsor-modal-close" aria-label="关闭">&times;</button>
      <div class="rating-modal-header">
        <h3 id="ratingTitle" data-i18n="ratingTitle">🎉 导出成功！</h3>
        <p data-i18n="ratingDesc">如果觉得好用，给个五星好评吧</p>
      </div>
      <div class="rating-modal-body">
        <div class="rating-stars">
          <span class="star">★</span>
          <span class="star">★</span>
          <span class="star">★</span>
          <span class="star">★</span>
          <span class="star">★</span>
        </div>
        <button id="ratingReviewBtn" type="button" class="btn btn-primary rating-review-btn">
          <span data-i18n="ratingReviewBtn">⭐ 去评价</span>
        </button>
        <button id="ratingSponsorLink" type="button" class="rating-sponsor-btn">
          <span class="rating-heart">❤️</span>
          <span data-i18n="ratingSponsorLink">赞助开发者</span>
        </button>
      </div>
      <div class="rating-modal-footer">
        <button id="ratingDismissBtn" type="button" class="rating-text-btn" data-i18n="ratingDismiss">不再提醒</button>
        <span class="rating-sep">|</span>
        <button id="ratingLaterBtn" type="button" class="rating-text-btn" data-i18n="ratingLater">下次再说</button>
      </div>
    </div>
  </div>

  <!-- Sponsor Modal -->
  <div id="sponsorModal" class="sponsor-modal" aria-hidden="true" inert>
    <div class="sponsor-modal-card" role="dialog" aria-modal="true" aria-labelledby="sponsorTitle">
      <button id="sponsorModalClose" class="sponsor-modal-close" data-i18n-aria-label="sponsorModalCloseLabel" aria-label="关闭赞助二维码">&times;</button>
      <div class="sponsor-modal-header">
        <h3 id="sponsorTitle" data-i18n="sponsorModalTitle">请我喝杯咖啡 ☕️</h3>
        <p data-i18n="sponsorModalDesc">如果这个工具帮到了你，欢迎小额赞助支持我继续维护。</p>
      </div>
      <div class="sponsor-modal-body">
        <div class="sponsor-qr-wrap">
          <span class="sponsor-qr-badge" data-i18n="sponsorBadge">❤️ 支持开发者</span>
          <img src="../asserts/sp.jpeg" data-i18n-alt="sponsorQrAlt" alt="赞助二维码" class="sponsor-qr">
        </div>
        <p class="sponsor-tip" data-i18n="sponsorTip">长按或扫描二维码，金额随意，感谢支持！</p>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
