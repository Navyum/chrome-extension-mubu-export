<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="selectionTitle">选择导出内容 · 幕布导出工具</title>
  <link rel="stylesheet" href="select-export.css">
</head>
<body>
  <main>
    <header class="page-header">
      <div><p class="eyebrow">MUBU EXPORTER</p><h1 data-i18n="selectionHeading">选择导出内容</h1>
        <p data-i18n="selectionIntro">勾选文件夹或文档，保留原目录层级导出。选择草稿自动保存。</p></div>
      <button id="refresh" type="button" data-i18n="selectionRefresh">获取 / 刷新文档列表</button>
    </header>
    <p id="notice" class="notice" role="status" aria-live="polite"></p>
    <section class="workspace">
      <section class="card catalog-panel" aria-labelledby="catalog-heading">
        <div class="card-heading"><h2 id="catalog-heading" data-i18n="selectionCatalog">文档目录</h2><span id="counts"></span></div>
        <div class="toolbar">
          <button id="select-all" type="button" data-i18n="selectionAll">全选</button>
          <button id="clear" type="button" data-i18n="selectionClear">清空选择</button>
          <span id="draft-status" role="status"></span>
        </div>
        <p id="catalog-warning" class="warning" role="status" hidden></p>
        <div id="tree" class="tree-container" aria-label="文档目录"></div>
      </section>
      <aside class="card task-panel">
        <h2 data-i18n="selectionExport">导出选中文档</h2>
        <label for="format" data-i18n="exportFormatLabel">导出格式</label>
        <select id="format">
          <option value="md">Markdown (.md)</option><option value="opml">OPML (.opml)</option>
          <option value="mm">FreeMind (.mm)</option><option value="html">HTML (.html)</option>
          <option value="docx">Word (.doc)</option><option value="pdf">PDF (.pdf)</option>
          <option value="json">JSON (.json)</option>
        </select>
        <button id="start" class="primary" type="button" disabled data-i18n="selectionStart">导出选中文档</button>
        <p class="hint" data-i18n="selectionNewTaskHint">每次开始都创建新任务。同名文件自动另存副本；修改选择不会改变已创建的任务。</p>
        <hr>
        <h2 data-i18n="selectionCurrentTask">本次任务</h2>
        <p id="task-state" role="status"></p>
        <p id="task-config" class="hint"></p>
        <progress id="progress" max="1" value="0" aria-label="本次任务进度"></progress>
        <p id="task-counts" class="task-counts"></p>
        <p id="recovery" class="warning" hidden></p>
        <div class="task-actions">
          <button id="pause" type="button" hidden data-i18n="pauseExport">暂停导出</button>
          <button id="resume" type="button" hidden data-i18n="resumeExport">继续导出</button>
          <button id="retry" type="button" hidden data-i18n="retryFailedFiles">重试失败文档</button>
        </div>
        <p class="hint" data-i18n="selectionPauseHint">暂停在当前文档处理结束后生效。关闭此页面不会取消后台任务。</p>
        <p class="hint" data-i18n="selectionDownloadHint">当前成功数沿用下载任务创建结果，请同时检查浏览器下载记录。</p>
      </aside>
    </section>
  </main>
  <script type="module" src="select-export.js"></script>
</body>
</html>
